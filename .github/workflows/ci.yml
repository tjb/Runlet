name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21"]
        include:
          - os: ubuntu-latest
            java: "25"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        shell: bash
        run: ./gradlew check

      - name: Validate local publication
        shell: bash
        run: ./gradlew publishToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  repeat-tests:
    name: Repeated tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Concurrency, cancellation, and shutdown tests can hide races that only show
      # up on some runs. Rerun the whole suite several times to surface flakiness.
      - name: Run test suite 10 times
        shell: bash
        run: |
          for run in $(seq 1 10); do
            echo "::group::Test run $run"
            ./gradlew test --rerun-tasks --no-build-cache
            echo "::endgroup::"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-repeated
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  ci-passed:
    name: CI passed
    if: always()
    needs: [check, repeat-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        shell: bash
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.repeat-tests.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}, repeat-tests: ${{ needs.repeat-tests.result }}"
            exit 1
          fi
